name: lockfile

# One-off: cargo is the only thing that can write a Cargo.lock, and the
# machine that maintains this repository cannot reach crates.io.  This job
# runs cargo where it has the network, commits the lock it produces to a
# branch of its own (`ci/cargo-lock`), and stops.  The file is then reviewed
# and merged by hand, which is the rule the release process states: a lock
# file is a review artefact, not something a CI job silently changes.
#
# Delete this workflow once implant/rust/Cargo.lock is in main.

on:
  # workflow_dispatch only resolves for files that exist on the default
  # branch, and this repository's work happens on a topic branch.  A push
  # that touches the trigger file is the equivalent, and it is deliberate:
  # one file, one run.
  push:
    paths:
      - .github/lockfile-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust-lock:
    name: cargo generate-lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4           # zizmor: ignore[unpinned-uses]
      - uses: dtolnay/rust-toolchain@stable # zizmor: ignore[unpinned-uses]

      - name: generate the lock and prove it resolves
        working-directory: implant/rust
        run: |
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > /dev/null
          test -s Cargo.lock
          echo "packages: $(grep -c '^\[\[package\]\]' Cargo.lock)"
          grep -E '^name = |^version = ' Cargo.lock | paste - - | sed 's/name = //; s/version = //' | head -20

      - name: commit it to a branch of its own
        run: |
          git config user.name "umbra-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci/cargo-lock
          git add implant/rust/Cargo.lock
          git commit -m "build(rust): Cargo.lock, generated by cargo $(cargo --version | cut -d' ' -f2)"
          git push --force origin ci/cargo-lock
