def envOr(String key, String fallback) {
    def value = System.getenv(key)
    return (value == null || value.trim().isEmpty()) ? fallback : value.trim()
}

// Quote a value for buildConfigField. A stray quote or backslash in an env var
// (paths and beacon ids are free-form) would otherwise break the generated
// BuildConfig.java with a syntax error that points at the generated file.
def envStr(String key, String fallback) {
    def escaped = envOr(key, fallback)
        .replace('\\', '\\\\')
        .replace('"', '\\"')
        .replace('\n', '\\n')
    return "\"${escaped}\""
}

// Integer variant: fail with the variable name instead of a Groovy cast error
// buried in the generated BuildConfig.  The value comes back as text, because
// that is what buildConfigField() takes: the type of the field is the first
// argument and the literal of the value is the third one.
def envInt(String key, int fallback) {
    def raw = System.getenv(key)
    if (raw == null || raw.trim().isEmpty()) return String.valueOf(fallback)
    try {
        return String.valueOf(Integer.parseInt(raw.trim()))
    } catch (NumberFormatException ignored) {
        throw new GradleException("${key} must be an integer, got '${raw}'")
    }
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.umbra.beacon'
    compileSdk 34
    // Pinned rather than inherited: AGP's default build-tools moves with the
    // plugin, and a build that changes its compiler without a commit is not
    // reproducible.  NDK is left to AGP on purpose -- see
    // docs/BUILD-EVIDENCE.md, "Android", for why it is not pinned yet.
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "io.umbra.beacon"
        // X25519 is provided by the platform XDH provider from API 33 onwards.
        minSdk 33
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }

        // ---- build-time beacon configuration -------------------------
        // Provide these as environment variables when building the APK:
        //   UMBRA_HOST UMBRA_PORT UMBRA_PSK UMBRA_AGENT_ID UMBRA_TRANSPORT
        //   UMBRA_HTTP_BASE UMBRA_HTTP_PATH UMBRA_SLEEP UMBRA_JITTER
        buildConfigField "String", "UMBRA_HOST", envStr('UMBRA_HOST', '10.0.2.2')
        buildConfigField "int", "UMBRA_PORT", envInt('UMBRA_PORT', 4001)
        buildConfigField "String", "UMBRA_PSK_HEX", envStr('UMBRA_PSK', '')
        buildConfigField "String", "UMBRA_AGENT_ID", envStr('UMBRA_AGENT_ID', '')
        buildConfigField "String", "UMBRA_TRANSPORT", envStr('UMBRA_TRANSPORT', 'tcp')
        buildConfigField "String", "UMBRA_HTTP_BASE", envStr('UMBRA_HTTP_BASE', 'http://10.0.2.2:4003')
        buildConfigField "String", "UMBRA_HTTP_PATH", envStr('UMBRA_HTTP_PATH', '/api/v1/beacon')
        buildConfigField "int", "UMBRA_SLEEP", envInt('UMBRA_SLEEP', 15)
        buildConfigField "int", "UMBRA_JITTER", envInt('UMBRA_JITTER', 30)
        // The address of the peer listener: a pivot can be chained through
        // the phone.  Empty means "no peer link".
        buildConfigField "String", "UMBRA_PEER_LISTEN", envStr('UMBRA_PEER_LISTEN', '')
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // The beacon deliberately has no third-party runtime dependencies: the
    // platform already provides AES-GCM, HMAC and X25519.
}
