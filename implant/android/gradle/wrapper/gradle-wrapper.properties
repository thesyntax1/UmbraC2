# Gradle wrapper metadata.
#
# The wrapper *jar* is a binary and is intentionally not committed; generate it
# once on a machine with Gradle installed:
#
#     cd implant/android && gradle wrapper --gradle-version 8.7
#
# Until then `make android-apk` and CI use the `gradle` CLI directly.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
