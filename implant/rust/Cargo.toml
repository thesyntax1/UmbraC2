[package]
name = "umbra-beacon"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "UmbraC2 beacon: cross-platform, memory-only implant for the umbra/v1 protocol"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "umbra_beacon"
path = "src/lib.rs"

[[bin]]
name = "umbra-beacon"
path = "src/main.rs"

[features]
default = ["transport-tcp", "transport-http", "transport-ws"]
transport-tcp = []
transport-http = []
# The WebSocket transport (RFC 6455) and the DNS tunnel need no extra crate.
transport-ws = []
transport-dns = []
# ChaCha20-Poly1305 is optional so the default build stays small; the server
# negotiates AES-256-GCM when this feature is off.
chacha = ["dep:chacha20poly1305"]

[dependencies]
aes-gcm = "0.10"
chacha20poly1305 = { version = "0.10", optional = true }
x25519-dalek = "2"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
rand = "0.8"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
