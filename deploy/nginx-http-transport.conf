# Reverse proxy for the UmbraC2 HTTP transport.
#
# Read this first, because it is easy to configure something that cannot work:
#
#   * the beacons speak plain HTTP/1.1 and have no TLS stack (deliberate: it
#     keeps the binary small and dependency-free), so a *TLS-terminating* proxy
#     in front of the listener is useless -- a plaintext HTTP client cannot
#     perform the TLS handshake with it.
#   * therefore the HTTP transport belongs inside an encrypted tunnel
#     (WireGuard, IPsec, an mTLS service mesh). The tunnel carries the
#     confidentiality; the protocol's own AEAD protects the payload end to end
#     regardless of the transport.
#   * what this proxy is actually for: access control, rate limiting, hiding the
#     service behind an ordinary-looking web server, and keeping the Go listener
#     bound to loopback inside the tunnel.
#
# If you *do* need TLS from the implant, that is a build-time feature (rustls),
# not a deployment trick -- see docs/SECURITY.md, limitation 1.
#
# Put the Go listener on loopback and let only this proxy reach it:
#     umbra-server -listen-http 127.0.0.1:4003
limit_req_zone $binary_remote_addr zone=umbra_beacon:10m rate=30r/s;

upstream umbra_beacon {
    server 127.0.0.1:4003;
    keepalive 16;
}

server {
    # Inside the tunnel. Add `listen 443 ssl` + certificates here only if you
    # front this with a TLS-terminating hop *and* the clients behind it speak
    # TLS (a bridge/relay), not directly with a beacon.
    listen 8080;
    server_name _;

    # Camouflage: answer everything else like a plain static site.
    root /var/www/html;
    index index.html;

    location = /api/v1/beacon {
        limit_req zone=umbra_beacon burst=60 nodelay;

        # A frame is at most 1 MiB + 24 + 16 bytes; allow room for a batch of
        # frames in one POST body.
        client_max_body_size 2m;

        proxy_pass http://umbra_beacon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # Binary frames: never buffer, never rewrite, and do not wait for a
        # full body before the backend sees the first byte.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Session-scoped path: /api/v1/beacon/<sid>. Kept URI-less so the session id
    # reaches the server verbatim (a trailing slash or a rewritten URI breaks
    # routing, and an unauthenticated sid is not a credential anyway).
    location /api/v1/beacon/ {
        limit_req zone=umbra_beacon burst=60 nodelay;
        client_max_body_size 2m;

        proxy_pass http://umbra_beacon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
